name: dlp-node-1

services:
  es-node-1:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-8.19.21}
    container_name: es-node-1
    environment:
      - node.name=node-1
      - cluster.name=dlp-cluster
      - network.host=0.0.0.0
      - network.publish_host=${HOST_IP}
      - discovery.seed_hosts=${PEER_IP}:9300
      - cluster.initial_master_nodes=node-1,node-2
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    mem_limit: 2g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata-node-1:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:${ES_VERSION:-8.19.21}
    container_name: kibana
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://es-node-1:9200
    mem_limit: 1536m
    ports:
      - "5601:5601"
    depends_on:
      es-node-1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  esdata-node-1:
